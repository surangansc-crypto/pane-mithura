<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>පුංචි පෑනේ මිතුරා 🎈</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+Sinhala:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Fredoka', 'Noto Sans Sinhala', sans-serif;
      background: linear-gradient(180deg, #93c5fd 0%, #fed7aa 60%, #fbcfe8 100%);
      min-height: 100vh;
      touch-action: manipulation;
    }
    .toy-card {
      border: 4px solid #ffffff;
      box-shadow: 0 10px 0 #fb923c, 0 18px 25px rgba(0,0,0,0.12);
      border-radius: 28px;
    }
    .btn-3d {
      box-shadow: 0 5px 0 #c2410c;
      transition: all 0.1s ease;
    }
    .btn-3d:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #c2410c;
    }
    .tab-btn.active {
      background: #ea580c;
      color: #ffffff;
      box-shadow: 0 4px 0 #9a3412;
    }
  </style>
</head>
<body class="p-3 sm:p-5 pb-24 text-slate-800">

  <!-- Top Bar -->
  <header class="max-w-xl mx-auto flex justify-between items-center bg-white/95 px-4 py-2.5 rounded-full shadow-md border-2 border-amber-300 mb-4">
    <div class="flex items-center gap-2">
      <span class="text-2xl animate-bounce">💌</span>
      <h1 class="text-lg sm:text-xl font-black text-orange-600">පුංචි පෑනේ මිතුරා</h1>
    </div>
    <button onclick="openAdminModal()" class="flex items-center gap-1 px-3 py-1.5 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded-full text-xs font-bold border border-amber-300 transition active:scale-95">
      <i data-lucide="settings" class="w-3.5 h-3.5 text-orange-600"></i>
      <span>ඇඩ්මින්</span>
    </button>
  </header>

  <!-- Navigation Tabs -->
  <div class="max-w-xl mx-auto grid grid-cols-2 gap-2 mb-4">
    <button onclick="switchTab('ai')" id="tabBtnAi" class="tab-btn active py-2.5 px-2 rounded-2xl text-xs sm:text-sm font-extrabold bg-white text-slate-700 shadow border border-slate-200 flex items-center justify-center gap-1.5 transition">
      <span>🤖 පෑනේ මිතුරාගෙන් අහන්න</span>
    </button>
    <button onclick="switchTab('friends')" id="tabBtnFriends" class="tab-btn py-2.5 px-2 rounded-2xl text-xs sm:text-sm font-extrabold bg-white text-slate-700 shadow border border-slate-200 flex items-center justify-center gap-1.5 transition">
      <span>👧👦 යාළුවෝ තෝරගන්න</span>
    </button>
  </div>

  <!-- VIEW 1: Q&A and Letters -->
  <main id="viewAi" class="max-w-xl mx-auto space-y-4">

    <!-- Profile Box -->
    <div class="bg-white/95 p-5 toy-card">
      <h2 class="text-sm font-extrabold text-orange-600 mb-3 flex items-center gap-2">
        <span>⭐</span> 1. මගේ විස්තර (Profile)
      </h2>

      <div class="flex items-center gap-3 bg-amber-50 p-3 rounded-2xl border-2 border-amber-200 mb-4">
        <div class="relative flex-shrink-0">
          <canvas id="avatarCanvas" width="80" height="80" class="w-16 h-16 rounded-2xl border-2 border-orange-400 bg-white shadow-inner"></canvas>
          <label for="photoFile" class="absolute -bottom-1 -right-1 bg-orange-500 text-white p-1.5 rounded-xl shadow cursor-pointer active:scale-90">
            <i data-lucide="camera" class="w-3.5 h-3.5"></i>
          </label>
          <input type="file" id="photoFile" accept="image/*" class="hidden" onchange="renderPhotoToCanvas(event)">
        </div>
        <div>
          <p class="text-xs font-bold text-slate-800">📸 ෆොටෝ එකක් දාන්න</p>
          <p class="text-[11px] text-slate-500">ලස්සන කාටූන් මුහුණක් ලෙස දිස්වේ.</p>
        </div>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">👶 ඔයාගේ නම:</label>
          <input type="text" id="kidName" placeholder="උදා: සෙනුරි / තිසර" class="w-full px-3 py-2.5 rounded-xl border-2 border-amber-200 text-xs font-bold bg-amber-50/30 focus:outline-none focus:border-orange-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">📱 දෙමාපියන්ගේ WhatsApp අංකය:</label>
          <input type="tel" id="kidPhone" placeholder="07XXXXXXXX" class="w-full px-3 py-2.5 rounded-xl border-2 border-amber-200 text-xs font-bold bg-amber-50/30 focus:outline-none focus:border-orange-500 font-mono">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">⚧️ ස්ත්‍රී / පුරුෂ:</label>
            <select id="kidGender" class="w-full px-2 py-2.5 rounded-xl border-2 border-amber-200 text-xs font-bold bg-amber-50/30">
              <option value="දුවක්">👧 දුවක් (Girl)</option>
              <option value="පුතෙක්">👦 පුතෙක් (Boy)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">🎂 වයස:</label>
            <select id="kidAge" class="w-full px-2 py-2.5 rounded-xl border-2 border-amber-200 text-xs font-bold bg-amber-50/30">
              <option value="අවු 5 - 8">අවු 5 - 8</option>
              <option value="අවු 9 - 12" selected>අවු 9 - 12</option>
              <option value="අවු 13 - 16">අවු 13 - 16</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Letter & Questions Box -->
    <div class="bg-white/95 p-5 toy-card">
      <h2 class="text-sm font-extrabold text-orange-600 mb-2 flex items-center gap-2">
        <span>✍️</span> 2. ප්‍රශ්නයක් අහන්න හෝ ලියුමක් ලියන්න
      </h2>

      <!-- Topic buttons -->
      <label class="block text-[11px] font-bold text-slate-600 mb-1.5">නිතර අසන මාතෘකා (Touch කරන්න):</label>
      <div id="topicsContainer" class="flex flex-wrap gap-1.5 mb-3"></div>

      <div class="mb-3">
        <label class="block text-xs font-bold text-slate-700 mb-1">📌 මාතෘකාව හෝ අහන දේ:</label>
        <input type="text" id="topicInput" placeholder="උදා: සිදුහත් කුමාරයා ගැන / හඳ ගැන..." class="w-full px-3 py-2 rounded-xl border-2 border-slate-200 text-xs font-bold focus:outline-none focus:border-orange-500">
      </div>

      <div class="mb-4">
        <label class="block text-xs font-bold text-slate-700 mb-1">📝 ඔයාගේ ලියුම හෝ විස්තරය (විකල්පයි):</label>
        <textarea id="letterInput" rows="2" placeholder="මිතුරේ, මට මේ ගැන කියලා දෙන්න පුළුවන්ද..." class="w-full p-3 rounded-xl border-2 border-amber-200 text-xs font-medium bg-amber-50/20 focus:outline-none focus:border-orange-500"></textarea>
      </div>

      <button onclick="handleSendToAI()" id="sendAiBtn" class="w-full py-3.5 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-black text-sm rounded-2xl btn-3d flex items-center justify-center gap-2">
        <span>ලියුම / ප්‍රශ්නය යවන්න 🚀</span>
      </button>
    </div>

    <!-- Real Knowledge Reply Envelope -->
    <div id="aiReplyCard" class="hidden bg-white/95 p-5 toy-card border-4 border-amber-400">
      <div class="flex justify-between items-center border-b pb-2 mb-2">
        <h3 id="replyHeaderTitle" class="text-xs font-bold text-orange-600"></h3>
        <span class="text-2xl animate-bounce">🕊️</span>
      </div>
      <div id="replyMessageText" class="text-xs text-slate-800 leading-relaxed whitespace-pre-line py-2"></div>
      <div class="mt-3 pt-2 border-t flex justify-between items-center">
        <button onclick="readAloudText()" class="px-3 py-1.5 bg-blue-100 text-blue-700 rounded-lg text-xs font-bold flex items-center gap-1 active:scale-95">
          <i data-lucide="volume-2" class="w-3.5 h-3.5"></i>
          <span>අහන්න</span>
        </button>
        <span class="text-[10px] text-green-700 font-bold bg-green-100 px-2 py-0.5 rounded-full">WhatsApp එකට යැවුණා ✅</span>
      </div>
    </div>

  </main>

  <!-- VIEW 2: Kid-to-Kid Friendship Board -->
  <main id="viewFriends" class="max-w-xl mx-auto space-y-4 hidden">
    <div class="bg-white/95 p-5 toy-card">
      <div class="flex justify-between items-center mb-3 border-b pb-2">
        <div>
          <h2 class="text-sm font-extrabold text-orange-600">👧👦 ලියාපදිංචි පෑනේ මිතුරන්</h2>
          <p class="text-[11px] text-slate-500">යාළුවෙක් තෝරාගෙන ආරක්ෂිතව ලියුම් එවන්න</p>
        </div>
        <button onclick="addMeToBoardManually()" class="px-3 py-1.5 bg-green-500 text-white font-bold text-xs rounded-xl shadow active:scale-95">
          + මාවත් දාන්න
        </button>
      </div>

      <div id="friendsListContainer" class="space-y-3"></div>
    </div>
  </main>

  <!-- Friend Connect Modal -->
  <div id="friendConnectModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl p-5 max-w-sm w-full border-4 border-amber-300 text-center">
      <h3 class="text-sm font-black text-orange-600 mb-2">💌 මිතුරු ලියුමක් යැවීම</h3>
      <div id="targetFriendInfo" class="bg-amber-50 p-2.5 rounded-xl text-xs text-slate-700 font-bold mb-3"></div>
      <textarea id="connectLetterText" rows="3" placeholder="ආයුබෝවන් යාළුවේ, මම ඔයා එක්ක පෑනේ මිතුරුකමක් පටන් ගන්න කැමතියි..." class="w-full p-2.5 rounded-xl border border-slate-200 text-xs mb-3 focus:outline-none"></textarea>
      
      <div class="flex gap-2">
        <button onclick="confirmFriendConnect()" class="flex-1 py-2.5 bg-orange-500 text-white font-bold text-xs rounded-xl shadow active:scale-95">යවන්න 🚀</button>
        <button onclick="closeFriendModal()" class="px-4 py-2.5 bg-slate-100 text-slate-600 font-bold text-xs rounded-xl">වසන්න</button>
      </div>
    </div>
  </div>

  <!-- ADMIN CONTROL MODAL -->
  <div id="adminModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl p-5 max-w-md w-full border-4 border-orange-400 max-h-[90vh] overflow-y-auto text-left">
      <div class="flex justify-between items-center border-b pb-2 mb-3">
        <h3 class="text-sm font-black text-orange-600 flex items-center gap-1.5">
          <i data-lucide="settings" class="w-4 h-4"></i>
          <span>ඇඩ්මින් පාලක පුවරුව</span>
        </h3>
        <button onclick="closeAdminModal()" class="text-slate-400 hover:text-slate-700 font-bold text-sm">✕</button>
      </div>

      <div class="space-y-3 text-xs">
        <div class="bg-slate-50 p-3 rounded-2xl border">
          <label class="block font-bold text-slate-700 mb-1">🔑 Gemini AI API Key එක:</label>
          <input type="text" id="adminApiKey" class="w-full p-2 rounded-xl border bg-white font-mono text-xs">
        </div>
        <div class="bg-slate-50 p-3 rounded-2xl border">
          <label class="block font-bold text-slate-700 mb-1">🎨 මාතෘකා ලැයිස්තුව (කොමාවලින් වෙන්කරන්න):</label>
          <textarea id="adminTopics" rows="2" class="w-full p-2 rounded-xl border bg-white text-xs"></textarea>
        </div>
      </div>

      <div class="mt-4 pt-2 border-t flex justify-end gap-2">
        <button onclick="closeAdminModal()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl font-bold text-xs">වසන්න</button>
        <button onclick="saveAdminSettings()" class="px-5 py-2 bg-orange-500 text-white rounded-xl font-bold text-xs btn-3d">සුරකින්න ✅</button>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // Your Direct API Key Pre-configured
    const MY_API_KEY = "AQ.Ab8RN6JPrxitue_CfS7lmKAfKLtyQ1Rj5GzLrcJUhdgih95K8A";

    const DEFAULT_CONFIG = {
      adminPass: "admin123",
      apiKey: MY_API_KEY,
      topics: [
        "සිදුහත් කුමාරයා ගැන",
        "හඳට යන්නේ කොහොමද?",
        "සතුන් කතා කරන හැටි",
        "ගස් වැල් අපිට උදව් වෙන හැටි",
        "වැස්ස ලැබෙන්නේ කොහොමද?",
        "මගේ සුරතල් සතා"
      ]
    };

    let appConfig = JSON.parse(localStorage.getItem('penpal_admin_config')) || DEFAULT_CONFIG;
    if (!appConfig.apiKey || appConfig.apiKey.length < 15) {
      appConfig.apiKey = MY_API_KEY;
    }

    let registeredFriends = JSON.parse(localStorage.getItem('penpal_friends_list')) || [
      { name: "දිනුක තිසර", age: "අවු 10", gender: "පුතෙක්", phone: "0712345678", interests: "ක්‍රිකට්, අභ්‍යවකාශය" },
      { name: "සෙනුරි නිම්නදි", age: "අවු 9", gender: "දුවක්", phone: "0778901234", interests: "චිත්‍ර ඇඳීම, බළලුන්" }
    ];
    let currentTarget = null;

    function switchTab(tab) {
      if (tab === 'ai') {
        document.getElementById('viewAi').classList.remove('hidden');
        document.getElementById('viewFriends').classList.add('hidden');
        document.getElementById('tabBtnAi').classList.add('active');
        document.getElementById('tabBtnFriends').classList.remove('active');
      } else {
        document.getElementById('viewAi').classList.add('hidden');
        document.getElementById('viewFriends').classList.remove('hidden');
        document.getElementById('tabBtnFriends').classList.add('active');
        document.getElementById('tabBtnAi').classList.remove('active');
        renderFriendsGrid();
      }
    }

    function initAvatar() {
      const c = document.getElementById('avatarCanvas');
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, 80, 80);
      let grad = ctx.createRadialGradient(35, 30, 5, 40, 40, 35);
      grad.addColorStop(0, '#fef08a');
      grad.addColorStop(0.6, '#fb923c');
      grad.addColorStop(1, '#ea580c');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(40, 40, 34, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.arc(30, 36, 4, 0, Math.PI * 2);
      ctx.arc(50, 36, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(40, 46, 10, 0.1 * Math.PI, 0.9 * Math.PI, false);
      ctx.stroke();
    }

    function renderPhotoToCanvas(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const c = document.getElementById('avatarCanvas');
          const ctx = c.getContext('2d');
          ctx.clearRect(0, 0, 80, 80);
          const sz = Math.min(img.width, img.height);
          ctx.drawImage(img, (img.width - sz)/2, (img.height - sz)/2, sz, sz, 0, 0, 80, 80);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function renderTopics() {
      const cont = document.getElementById('topicsContainer');
      cont.innerHTML = '';
      appConfig.topics.forEach(t => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = "px-2.5 py-1.5 bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold text-[11px] rounded-xl border border-amber-300 active:scale-95";
        b.innerText = t;
        b.onclick = () => {
          document.getElementById('topicInput').value = t;
        };
        cont.appendChild(b);
      });
    }

    // Call Real Gemini AI with correct 2026 Models endpoint
    async function callGeminiAPI(queryText, childName, childAge) {
      const activeKey = (appConfig.apiKey && appConfig.apiKey.length > 15) ? appConfig.apiKey.trim() : MY_API_KEY;
      
      const prompt = `ඔබ කුඩා ළමයින්ගේ ආදරණීය "පෑනේ මිතුරා" වෙයි. 
දරුවාගේ නම: ${childName} (වයස: ${childAge}).
දරුවා අසන ප්‍රශ්නය: "${queryText}".

උපදෙස්:
1. දරුවා ඇසූ ප්‍රශ්නයට අදාළව (උදා: සිදුහත් කුමාරයා නම් උන්වහන්සේගේ දෙමාපියන්, උපත, මාලිගා, සතර පෙරනිමිති, ගිහිගෙය හැරයාම වැනි) නිවැරදිම කරුණු ඇතුළත් සවිස්තරාත්මක, ආදරණීය පිළිතුරක් සරල සිංහලෙන් ලියන්න.
2. පිළිතුර මෙසේ ආරම්භ කරන්න: "ආයුබෝවන් ${childName} යාළුවේ,"
3. පිළිතුර අවසානයේ: "ආදරයෙන්, ඔයාගේ පෑනේ මිතුරා 🕊️" ලෙස සටහන් කරන්න.
4. AI ගැන සඳහන් නොකර සැබෑ මිතුරෙක් ලෙස පමණක් ලියන්න.`;

      // Try gemini-2.5-flash endpoint (compatible with AQ. keys)
      const endpoints = [
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${activeKey}`,
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${activeKey}`
      ];

      for (let url of endpoints) {
        try {
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ role: 'user', parts: [{ text: prompt }] }],
              generationConfig: { temperature: 0.7, maxOutputTokens: 800 }
            })
          });
          const data = await res.json();
          if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
            return data.candidates[0].content.parts[0].text;
          }
        } catch (err) {
          console.warn("Attempt failed for endpoint", url, err);
        }
      }
      return null;
    }

    async function handleSendToAI() {
      const name = document.getElementById('kidName').value.trim();
      const phone = document.getElementById('kidPhone').value.trim();
      const age = document.getElementById('kidAge').value;
      const topic = document.getElementById('topicInput').value.trim();
      const text = document.getElementById('letterInput').value.trim();

      if (!name) return alert("කරුණාකර ඔයාගේ නම ලියන්න! 😊");
      if (!phone) return alert("කරුණාකර දෙමාපියන්ගේ WhatsApp අංකය දාන්න! 📱");
      if (!topic && !text) return alert("කරුණාකර අහන්න ඕන දේ හෝ මාතෘකාව ලියන්න!");

      const fullQuery = topic ? `${topic} ${text}` : text;

      // WhatsApp to Admin (0784693750)
      const waMsg = `🔔 *පුංචි පෑනේ මිතුරා - නව ප්‍රශ්නයක්!*\n\n👦 නම: ${name}\n📞 දුරකථනය: ${phone}\n🎂 වයස: ${age}\n📌 මාතෘකාව: ${topic}\n📝 විස්තරය: "${text}"`;
      window.open(`https://api.whatsapp.com/send?phone=94784693750&text=${encodeURIComponent(waMsg)}`, '_blank');

      const btn = document.getElementById('sendAiBtn');
      btn.innerText = "Google AI මඟින් පිළිතුර ලියමින් පවතී... ⏳";
      btn.disabled = true;

      // Real Gemini API Call
      const aiReply = await callGeminiAPI(fullQuery, name, age);

      if (aiReply) {
        displayReply(name, age, aiReply);
      } else {
        // Precise factual backup only if network fails
        let fallback = `ආයුබෝවන් ${name} යාළුවේ,\n\nඔයා ඇසූ "${topic}" ගැන මම ඔයාට විස්තර කරන්නම්:\n\nසිදුහත් කුමාරයා උපත ලැබුවේ නේපාලයේ ලුම්බිණි සල් උයනේදීයි. පියා සුද්ධෝදන රජතුමා වූ අතර මව මහාමායා දේවියයි. කුමාරයා යශෝධරා දේවිය සමඟ විවාහ වී රම්‍ය, සුරම්‍ය, සුභ නම් මාලිගාවල වාසය කළා. පසුව මහල්ලා, ලෙඩා, මළමිනිය සහ පැවිදි රුව දැක සත්‍ය සොයා ගිහිගෙයින් නික්මී අවසානයේ බුද්ධත්වයට පත්වුණා!\n\nආදරයෙන්,\nඔයාගේ පෑනේ මිතුරා 🕊️`;
        displayReply(name, age, fallback);
      }

      btn.innerText = "ලියුම / ප්‍රශ්නය යවන්න 🚀";
      btn.disabled = false;
    }

    function displayReply(name, age, text) {
      document.getElementById('replyHeaderTitle').innerText = `ආදරණීය ${name} වෙත පෑනේ මිතුරාගෙන් (${age})`;
      document.getElementById('replyMessageText').innerText = text;
      document.getElementById('aiReplyCard').classList.remove('hidden');
      document.getElementById('aiReplyCard').scrollIntoView({ behavior: 'smooth' });
    }

    // Friends Board
    function renderFriendsGrid() {
      const cont = document.getElementById('friendsListContainer');
      cont.innerHTML = '';
      registeredFriends.forEach((f, idx) => {
        const item = document.createElement('div');
        item.className = "p-3 bg-amber-50/70 rounded-2xl border-2 border-amber-200 flex items-center justify-between";
        item.innerHTML = `
          <div class="flex items-center gap-3">
            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=${f.name}" class="w-12 h-12 rounded-xl bg-white border border-orange-300 shadow-sm">
            <div class="text-left">
              <h4 class="text-xs font-black text-slate-800">${f.name}</h4>
              <p class="text-[11px] text-orange-600 font-bold">${f.gender} • ${f.age}</p>
              <p class="text-[10px] text-slate-500">🎨 විනෝදාංශ: ${f.interests || 'චිත්‍ර'}</p>
            </div>
          </div>
          <button onclick="openFriendModal(${idx})" class="px-3 py-2 bg-orange-500 text-white font-bold text-xs rounded-xl shadow btn-3d">
            මිතුරු වෙන්න 💌
          </button>
        `;
        cont.appendChild(item);
      });
    }

    function addMeToBoardManually() {
      const name = document.getElementById('kidName').value.trim();
      const phone = document.getElementById('kidPhone').value.trim();
      const gender = document.getElementById('kidGender').value;
      const age = document.getElementById('kidAge').value;
      if (!name || !phone) return alert("කරුණාකර පළමුව නම සහ දුරකථනය ඇතුළත් කරන්න!");

      registeredFriends.unshift({ name, age, gender, phone, interests: "චිත්‍ර ඇඳීම" });
      localStorage.setItem('penpal_friends_list', JSON.stringify(registeredFriends));
      renderFriendsGrid();
      alert("ඔබව සාර්ථකව මිතුරු පුවරුවට එකතු කරන ලදී! 🎉");
    }

    function openFriendModal(idx) {
      currentTarget = registeredFriends[idx];
      document.getElementById('targetFriendInfo').innerText = `මිතුරා: ${currentTarget.name} (${currentTarget.age})`;
      document.getElementById('friendConnectModal').classList.remove('hidden');
    }

    function closeFriendModal() {
      document.getElementById('friendConnectModal').classList.add('hidden');
    }

    function confirmFriendConnect() {
      const myName = document.getElementById('kidName').value.trim();
      const myPhone = document.getElementById('kidPhone').value.trim();
      const msg = document.getElementById('connectLetterText').value.trim();

      if (!myName || !myPhone) return alert("කරුණාකර පළමු පිටුවේ ඔබගේ නම සහ දුරකථනය දාන්න!");
      if (!msg) return alert("කරුණාකර කෙටි ලියුමක් ලියන්න!");

      const adminUrl = `https://api.whatsapp.com/send?phone=94784693750&text=${encodeURIComponent(`🤝 *නව මිතුරු හමුවක්!*\n\n👦 යවන්නා: ${myName} (${myPhone})\n👧 ලබන්නා: ${currentTarget.name} (${currentTarget.phone})\n\n📝 ලිපිය: "${msg}"`)}`;
      window.open(adminUrl, '_blank');
      alert("මිතුරු ඉල්ලීම WhatsApp වෙත යොමු විය!");
      closeFriendModal();
    }

    function readAloudText() {
      const text = document.getElementById('replyMessageText').innerText;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'si-LK';
      u.rate = 0.9;
      window.speechSynthesis.speak(u);
    }

    function openAdminModal() {
      const pass = prompt("ඇඩ්මින් මුරපදය:");
      if (pass === appConfig.adminPass) {
        document.getElementById('adminApiKey').value = appConfig.apiKey || "";
        document.getElementById('adminTopics').value = appConfig.topics.join(', ');
        document.getElementById('adminModal').classList.remove('hidden');
      } else if (pass !== null) {
        alert("මුරපදය වැරදියි!");
      }
    }

    function closeAdminModal() {
      document.getElementById('adminModal').classList.add('hidden');
    }

    function saveAdminSettings() {
      appConfig.apiKey = document.getElementById('adminApiKey').value.trim();
      const t = document.getElementById('adminTopics').value.trim();
      if (t) appConfig.topics = t.split(',').map(x => x.trim()).filter(x => x.length > 0);
      localStorage.setItem('penpal_admin_config', JSON.stringify(appConfig));
      renderTopics();
      alert("සුරකින ලදී!");
      closeAdminModal();
    }

    window.onload = () => {
      initAvatar();
      renderTopics();
      renderFriendsGrid();
    };
  </script>
