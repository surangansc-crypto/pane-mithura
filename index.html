<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>පුංචි පෑනේ මිතුරා | Kids AI Pen Pal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+Sinhala:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Fredoka', 'Noto Sans Sinhala', sans-serif;
      background: radial-gradient(circle at top, #fef08a, #fed7aa, #bae6fd);
      min-height: 100vh;
      touch-action: manipulation;
    }
    .kid-card {
      border-radius: 28px;
      box-shadow: 0 14px 0 #fb923c, 0 20px 25px rgba(0,0,0,0.1);
      border: 4px solid #fff;
    }
    .kid-btn {
      box-shadow: 0 6px 0 #c2410c;
      transition: all 0.1s ease-in-out;
    }
    .kid-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #c2410c;
    }
    .letter-box {
      background: #fffdf5;
      background-image: repeating-linear-gradient(transparent, transparent 31px, #fed7aa 31px, #fed7aa 33px);
      line-height: 33px;
    }
  </style>
</head>
<body class="p-3 sm:p-6 pb-20 select-none">

  <!-- Main App Header -->
  <header class="max-w-2xl mx-auto text-center mb-5">
    <div class="inline-flex items-center gap-2 bg-white px-5 py-2.5 rounded-full shadow-md border-2 border-amber-300 mb-2">
      <span class="text-3xl animate-bounce">💌</span>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-orange-600">පුංචි පෑනේ මිතුරා</h1>
    </div>
    <p class="text-xs font-bold text-amber-900 bg-amber-200/60 inline-block px-3 py-1 rounded-full">
      🎈 ළමයින්ගේ ආදරණීය 3D යාළුවා 🎈
    </p>
  </header>

  <!-- Single Easy-to-use Form Container -->
  <main class="max-w-2xl mx-auto space-y-5">

    <!-- Step 1: Profile & 3D Photo -->
    <div class="bg-white/95 rounded-3xl p-5 kid-card">
      <h2 class="text-base font-extrabold text-orange-500 mb-4 flex items-center gap-2">
        <span>⭐</span> 1. මගේ විස්තර දාන්න
      </h2>

      <!-- 3D Photo Avatar Box -->
      <div class="flex items-center gap-4 mb-4 bg-amber-50 p-3 rounded-2xl border-2 border-amber-200">
        <div class="relative flex-shrink-0">
          <canvas id="photoCanvas" width="90" height="90" class="w-20 h-20 rounded-2xl border-2 border-orange-400 bg-white shadow-inner"></canvas>
          <label for="cameraFile" class="absolute -bottom-2 -right-2 bg-orange-500 text-white p-2 rounded-xl shadow cursor-pointer active:scale-90 transition">
            <i data-lucide="camera" class="w-4 h-4"></i>
          </label>
          <input type="file" id="cameraFile" accept="image/*" class="hidden" onchange="loadPhoto(event)">
        </div>
        <div class="text-left">
          <p class="text-xs font-bold text-slate-700">📸 ඔයාගේ ෆොටෝ එකක් දාන්න</p>
          <p class="text-[11px] text-slate-500 mt-0.5">එය මෙතැන ලස්සන 3D කාටූන් එකක් ලෙස පෙනේවි!</p>
        </div>
      </div>

      <!-- Inputs Grid -->
      <div class="space-y-3 text-left">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">👶 ඔයාගේ නම:</label>
          <input type="text" id="kidName" placeholder="උදා: සෙනුරි / තිසර" class="w-full px-4 py-3 rounded-2xl border-2 border-amber-200 bg-amber-50/50 text-sm font-bold text-slate-800 focus:outline-none focus:border-orange-400">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">📱 දෙමාපියන්ගේ WhatsApp අංකය:</label>
          <input type="tel" id="kidPhone" placeholder="07XXXXXXXX" class="w-full px-4 py-3 rounded-2xl border-2 border-amber-200 bg-amber-50/50 text-sm font-bold text-slate-800 focus:outline-none focus:border-orange-400 font-mono">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">⚧️ ස්ත්‍රී / පුරුෂ:</label>
            <select id="kidGender" class="w-full px-3 py-3 rounded-2xl border-2 border-amber-200 bg-amber-50/50 text-xs font-bold text-slate-800 focus:outline-none">
              <option value="දුවක්">👧 දුවක් (Girl)</option>
              <option value="පුතෙක්">👦 පුතෙක් (Boy)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">🎂 වයස:</label>
            <select id="kidAge" class="w-full px-3 py-3 rounded-2xl border-2 border-amber-200 bg-amber-50/50 text-xs font-bold text-slate-800 focus:outline-none">
              <option value="අවුරුදු 5 - 8">අවු 5 - 8</option>
              <option value="අවුරුදු 9 - 12" selected>අවු 9 - 12</option>
              <option value="අවුරුදු 13 - 16">අවු 13 - 16</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Step 2: Choose Topic & Write Letter -->
    <div class="bg-white/95 rounded-3xl p-5 kid-card">
      <h2 class="text-base font-extrabold text-orange-500 mb-3 flex items-center gap-2">
        <span>✍️</span> 2. මාතෘකාවක් සහ ලියුම
      </h2>

      <!-- Quick Topic Badges (Large Tap Targets) -->
      <label class="block text-xs font-bold text-slate-600 mb-1.5 text-left">කැමති මාතෘකාවක් ඔබන්න (Touch):</label>
      <div id="topicsContainer" class="flex flex-wrap gap-2 mb-3">
        <!-- Generated by JS -->
      </div>

      <!-- Custom Topic Input -->
      <div class="mb-3 text-left">
        <input type="text" id="topicInput" placeholder="හෝ අලුත් මාතෘකාවක් මෙතන ටයිප් කරන්න..." class="w-full px-4 py-2.5 rounded-2xl border-2 border-slate-200 text-xs font-bold text-slate-700 focus:outline-none focus:border-orange-400">
      </div>

      <!-- Letter Content -->
      <div class="text-left mb-4">
        <label class="block text-xs font-bold text-slate-700 mb-1">📝 ඔයාට කියන්න හෝ අහන්න ඕන දේ:</label>
        <textarea id="letterText" rows="4" placeholder="ආයුබෝවන් මිතුරේ, අද මට ඔයාට කියන්න ඕනේ..." class="w-full p-4 rounded-2xl border-2 border-amber-200 bg-amber-50/30 text-xs sm:text-sm font-medium text-slate-800 focus:outline-none focus:border-orange-400 letter-box"></textarea>
      </div>

      <!-- Big Friendly Send Button -->
      <button onclick="handleSend()" id="sendBtn" class="w-full py-4 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white text-base font-extrabold rounded-2xl kid-btn flex items-center justify-center gap-2">
        <span>ලියුම යවන්න 🚀</span>
      </button>
    </div>

    <!-- Step 3: Friendly Pen Pal Response Envelope -->
    <div id="replyWrapper" class="hidden bg-white/95 rounded-3xl p-5 kid-card border-4 border-amber-400">
      <div class="flex justify-between items-center border-b-2 border-dashed border-amber-200 pb-3 mb-3">
        <div class="text-left">
          <span class="text-xs font-extrabold text-orange-500 block">🕊️ පෑනේ මිතුරාගේ පිළිතුර</span>
          <h3 id="replyNameHeader" class="text-sm font-bold text-slate-800"></h3>
        </div>
        <span class="text-3xl">🎉</span>
      </div>

      <div id="replyBody" class="text-left text-xs sm:text-sm text-slate-800 leading-relaxed whitespace-pre-line py-2">
        <!-- Reply loads here -->
      </div>

      <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center">
        <button onclick="readAloud()" class="px-4 py-2 bg-blue-100 text-blue-700 rounded-xl font-bold text-xs flex items-center gap-1.5 active:scale-95">
          <i data-lucide="volume-2" class="w-4 h-4"></i>
          <span>අහන්න (Listen)</span>
        </button>
        <span class="text-[10px] text-green-700 font-bold bg-green-100 px-2.5 py-1 rounded-full">WhatsApp පණිවිඩය යැවුණා ✅</span>
      </div>
    </div>

  </main>

  <!-- Admin Icon (Discrete bottom left) -->
  <button onclick="openAdmin()" class="fixed bottom-3 right-3 w-10 h-10 rounded-full bg-slate-400/60 hover:bg-slate-700 text-white flex items-center justify-center shadow-lg backdrop-blur">
    <i data-lucide="lock" class="w-4 h-4"></i>
  </button>

  <script>
    lucide.createIcons();

    // Default Topics List
    let topicsList = [
      "🚀 අභ්‍යවකාශය ගැන",
      "🦁 සතුන් ගැන",
      "🏫 මගේ පාසල",
      "🎨 චිත්‍ර අඳිමු",
      "⚽ මම ආසම ක්‍රීඩාව"
    ];

    // Load default cartoon face on canvas
    function initAvatar() {
      const c = document.getElementById('photoCanvas');
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, 90, 90);
      
      // 3D Soft Ball
      let grad = ctx.createRadialGradient(40, 35, 5, 45, 45, 40);
      grad.addColorStop(0, '#fef08a');
      grad.addColorStop(0.6, '#fb923c');
      grad.addColorStop(1, '#ea580c');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(45, 45, 38, 0, Math.PI * 2);
      ctx.fill();

      // Eyes & Smile
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(33, 40, 6, 0, Math.PI * 2);
      ctx.arc(57, 40, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.arc(33, 40, 3, 0, Math.PI * 2);
      ctx.arc(57, 40, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(45, 52, 12, 0.1 * Math.PI, 0.9 * Math.PI, false);
      ctx.stroke();
    }

    // Convert real photo into 3D Cartoon Clay style on canvas
    function loadPhoto(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const c = document.getElementById('photoCanvas');
          const ctx = c.getContext('2d');
          ctx.clearRect(0, 0, 90, 90);

          const size = Math.min(img.width, img.height);
          ctx.drawImage(img, (img.width-size)/2, (img.height-size)/2, size, size, 0, 0, 90, 90);

          // 3D Lighting & Cartoon Shade
          const overlay = ctx.createRadialGradient(30, 30, 10, 45, 45, 50);
          overlay.addColorStop(0, 'rgba(255, 255, 255, 0.4)');
          overlay.addColorStop(0.7, 'rgba(255, 255, 255, 0)');
          overlay.addColorStop(1, 'rgba(0, 0, 0, 0.35)');
          ctx.fillStyle = overlay;
          ctx.fillRect(0, 0, 90, 90);
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Render topics buttons with big touch targets
    function renderTopics() {
      const cont = document.getElementById('topicsContainer');
      cont.innerHTML = '';
      topicsList.forEach(t => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = "px-3.5 py-2 bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold text-xs rounded-2xl active:scale-95 transition shadow-sm border border-amber-300";
        btn.innerText = t;
        btn.onclick = () => {
          document.getElementById('topicInput').value = t;
          document.getElementById('letterText').value = t + " ගැන මට කියන්න:";
        };
        cont.appendChild(btn);
      });
    }

    // Handle Send & Auto WhatsApp
    function handleSend() {
      const name = document.getElementById('kidName').value.trim();
      const phone = document.getElementById('kidPhone').value.trim();
      const gender = document.getElementById('kidGender').value;
      const age = document.getElementById('kidAge').value;
      const topic = document.getElementById('topicInput').value.trim() || "සාමාන්‍ය දැනුම";
      const letter = document.getElementById('letterText').value.trim();

      if (!name) {
        alert("කරුණාකර ඔයාගේ නම ඇතුළත් කරන්න! 😊");
        return;
      }
      if (!phone) {
        alert("කරුණාකර දෙමාපියන්ගේ දුරකථන/WhatsApp අංකය දාන්න! 📱");
        return;
      }
      if (!letter) {
        alert("කරුණාකර ලියුමක් හෝ ප්‍රශ්නයක් ලියන්න! ✍️");
        return;
      }

      // 1. Send WhatsApp directly to Admin (0784693750)
      const msg = `🔔 *පුංචි පෑනේ මිතුරා වෙතින් නව ලිපියක්!*\n\n👦 නම: ${name}\n📞 දුරකථනය: ${phone}\n⚧️ ස්ත්‍රී/පුරුෂ: ${gender}\n🎂 වයස: ${age}\n📌 මාතෘකාව: ${topic}\n\n📝 ලිපිය: "${letter}"`;
      const waUrl = `https://api.whatsapp.com/send?phone=94784693750&text=${encodeURIComponent(msg)}`;
      window.open(waUrl, '_blank');

      // 2. Generate Warm Educational Response
      document.getElementById('replyNameHeader').innerText = `ආදරණීය ${name} වෙත (${age})`;
      document.getElementById('replyBody').innerText = `ආයුබෝවන් ${name} යාළුවේ,\n\nඔයා මට එවපු ලියුම කියවලා මට හරිම සතුටු හිතුණා! "${topic}" ගැන ඔයා අහපු කරුණ හරිම ලස්සනයි.\n\nස්වභාවධර්මය සහ අපේ ලෝකය හරිම පුදුමාකාරයි. ඔයා පාසලේ වැඩත් හොඳින් කරලා, හැමදාම අලුත් දේවල් ඉගෙන ගන්න උනන්දු වෙන්න. මම හැමදාම ඔයාගේ හොඳ පෑනේ මිතුරා විදියට ඔයාට උදව් කරනවා!\n\nආදරයෙන්,\nඔයාගේ 3D පෑනේ මිතුරා 🕊️`;

      document.getElementById('replyWrapper').classList.remove('hidden');
      document.getElementById('replyWrapper').scrollIntoView({ behavior: 'smooth' });
    }

    // Voice Read
    function readAloud() {
      const text = document.getElementById('replyBody').innerText;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'si-LK';
      u.rate = 0.9;
      window.speechSynthesis.speak(u);
    }

    // Admin Access
    function openAdmin() {
      const p = prompt("ඇඩ්මින් මුරපදය ගසන්න:");
      if (p === "admin123") {
        const newTopic = prompt("අලුත් මාතෘකාවක් එකතු කරන්න (උදා: ගස් වැල් ගැන):");
        if (newTopic) {
          topicsList.unshift(newTopic);
          renderTopics();
          alert("මාතෘකාව සාර්ථකව එකතු විය!");
        }
      } else if (p !== null) {
        alert("මුරපදය වැරදියි!");
      }
    }

    window.onload = () => {
      initAvatar();
      renderTopics();
    };
  </script>
</body>
</html>
